<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 90" preserveAspectRatio="none" style="width: 100%; height: 75px; display: block;">
  <defs>
    <linearGradient id="footer-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
    <linearGradient id="footer-navy-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08234D" />
      <stop offset="100%" stop-color="#061B3B" />
    </linearGradient>
  </defs>

  <!-- Deep navy base fill -->
  <rect width="1440" height="90" fill="url(#footer-navy-fade)" />

  <!-- Subtle ambient blue glow curve -->
  <path d="M 0,35 C 150,75 320,60 480,0 L 920,0 C 1080,68 1260,75 1440,0 L 1440,90 L 0,90 Z" fill="#061B3B" />

  <!-- Top-left orange ribbon swoosh -->
  <path d="M 0,0 L 460,0 C 370,28 230,70 100,70 C 45,70 12,52 0,38 Z" fill="url(#footer-orange-grad)" />

  <!-- Top-left white cap -->
  <path d="M 0,0 L 410,0 C 320,18 190,46 75,46 C 28,46 8,30 0,18 Z" fill="#FFFFFF" />

  <!-- Top-right orange swoosh ribbon -->
  <path d="M 940,0 C 1030,16 1140,64 1270,64 C 1350,64 1408,32 1440,0 Z" fill="url(#footer-orange-grad)" />

  <!-- Top-right white cap -->
  <path d="M 1010,0 C 1085,12 1175,42 1270,42 C 1345,42 1402,18 1440,0 Z" fill="#FFFFFF" />

  <!-- Sleek highlight line along the bottom of the orange ribbons -->
  <path d="M 0,38 C 12,52 45,70 100,70 C 230,70 370,28 460,0" fill="none" stroke="rgba(255, 122, 0, 0.4)" stroke-width="1.5" />
  <path d="M 940,0 C 1030,16 1140,64 1270,64 C 1350,64 1408,32 1440,0" fill="none" stroke="rgba(255, 122, 0, 0.4)" stroke-width="1.5" />
</svg>
