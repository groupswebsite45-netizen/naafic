version: '3.8'

networks:
  coolify:
    external: true
  internal:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: ${POSTGRES_DB:-hawlwadaag_school_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hawlwadaag_school_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-123}@db:5432/${POSTGRES_DB:-hawlwadaag_school_db}
      APP_ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - internal
      - coolify
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.schoolms-http.rule=Host(`08gkjci5ttjzqpjkvddukghf.164.68.126.77.sslip.io`)"
      - "traefik.http.routers.schoolms-http.entryPoints=http"
      - "traefik.http.services.schoolms-http.loadbalancer.server.port=80"
      - "traefik.http.routers.schoolms-https.rule=Host(`08gkjci5ttjzqpjkvddukghf.164.68.126.77.sslip.io`)"
      - "traefik.http.routers.schoolms-https.entryPoints=https"
      - "traefik.http.routers.schoolms-https.tls=true"
      - "traefik.http.routers.schoolms-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.schoolms-https.loadbalancer.server.port=80"

volumes:
  pgdata:
  uploads_data:
